<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | NAZAS National</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <img src="images/nazas-logo.png" alt="NAZAS Logo">
                <span>NATIONAL ASSOCIATION OF ZAZZAU STUDENTS</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <div class="dropdown">
                    <a href="index.html#about-section">About ▾</a>
                    <div class="dropdown-content">
                        <a href="history.html">History of NAZAS</a>
                        <a href="index.html#mission">Mission & Vision</a>
                    </div>
                </div>
                <a href="gallery.html">Gallery</a>
                <a href="index.html#contact">Contact Us</a>
            </nav>
        </div>
    </header>

    <section class="gallery-hero">
        <h1>Moments & <span>Memories</span></h1>
        <p>A visual journey through our cultural heritage and student activities.</p>
    </section>

    <main class="gallery-container">
        <div class="photo-grid">
            <div class="photo-item">
                <img src="images/gallery-1.jpg" alt="Durbar Festival">
                <div class="photo-overlay"><span>Durbar Celebration</span></div>
            </div>
            <div class="photo-item tall">
                <img src="images/gallery-2.jpg" alt="Student Meeting">
                <div class="photo-overlay"><span>General Assembly</span></div>
            </div>
            <div class="photo-item">
                <img src="images/gallery-3.jpg" alt="Award Ceremony">
                <div class="photo-overlay"><span>Award Night</span></div>
            </div>
            <div class="photo-item wide">
                <img src="images/gallery-4.jpg" alt="Group Photo">
                <div class="photo-overlay"><span>NAZAS Executives</span></div>
            </div>
            <div class="photo-item">
                <img src="images/gallery-5.jpg" alt="Heritage Day">
                <div class="photo-overlay"><span>Cultural Heritage Day</span></div>
            </div>
            </div>
    </main>

    <footer class="main-footer">
        </footer>

</body>
</html>
